version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: banoma
      POSTGRES_PASSWORD: banoma
      POSTGRES_DB: banoma
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  api:
    build: ./services/api
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - '8000:8000'
    command: >
      sh -c "python manage.py migrate && gunicorn banoma_project.wsgi:application --bind 0.0.0.0:8000"

  celery:
    build:
      context: ./services/api
      dockerfile: Dockerfile.celery
    env_file: .env
    depends_on:
      - redis
      - postgres

  ai:
    build: ./services/ai
    env_file: .env
    ports:
      - '8001:8000'

  web:
    build: ./apps/web
    env_file: .env
    depends_on:
      - api
    ports:
      - '3000:3000'

volumes:
  pg_data:
  minio_data:
